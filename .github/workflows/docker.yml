name: CI/CD - Lint + Build + Push + Deploy
on:
  push:
    branches: [ "develop" ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # 1. Code checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python (for lint)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install lint
      - name: Install flake8
        run: pip install flake8

      # 4. Run lint
      - name: Run lint
        run: flake8 . || true

      # 5. Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest-django httpx
          pip install -r api/requirements-dev.txt
          pip install -r django_political_app/requirements-dev.txt

      - name: Set environment variables
        run: |
          echo "DJANGO_SETTINGS_MODULE=django_political_app.settings" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key" >> $GITHUB_ENV

      # 6. Tests
      - name: Run tests
        run: pytest

      # 7. Login GitHub Container Registry
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 8. Build + push FASTAPI
      - name: Build and push FastAPI
        run: |
          docker build -t ghcr.io/alexandrecrestien/fastapi-app:v1.0 ./api
          docker push ghcr.io/alexandrecrestien/fastapi-app:v1.0

      # 9. Build + push DJANGO
      - name: Build and push Django
        run: |
          docker build -t ghcr.io/alexandrecrestien/django-app:v1.0 ./django_political_app
          docker push ghcr.io/alexandrecrestien/django-app:v1.0

      # 10. Build + push INGEST
      - name: Build and push Ingest
        run: |
          docker build -t ghcr.io/alexandrecrestien/ingest-app:v1.0 -f scripts/Dockerfile .
          docker push ghcr.io/alexandrecrestien/ingest-app:v1.0

      # 11. Copy docker-compose.prod to VPS
      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yaml"
          target: "~/political-prediction/"

      # 12. Deploy on VPS
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p ~/political-prediction/letsencrypt
            cd ~/political-prediction
            cat > .env << 'EOF'
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DEBUG=${{ secrets.DEBUG }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d