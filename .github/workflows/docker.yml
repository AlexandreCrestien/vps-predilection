name: CI/CD - Lint + Build + Push + Deploy
on:
  push:
    branches: [ "develop" ]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      # 1. Code checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python (for lint)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install lint
      - name: Install flake8
        run: pip install flake8

      # 4. Run lint
      - name: Run lint
        run: flake8 . || true

      # 5. Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest-django httpx
          pip install -r api/requirements-dev.txt
          pip install -r django_political_app/requirements-dev.txt

      - name: Set environment variables
        run: |
          echo "DJANGO_SETTINGS_MODULE=django_political_app.settings" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key" >> $GITHUB_ENV

      # 6. Tests
      - name: Run tests
        run: pytest

      # 7. Login to GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 8. Build + push FASTAPI
      - name: Extract metadata for FastAPI
        id: meta-fastapi
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/alexandrecrestien/fastapi-app

      - name: Build and push FastAPI
        id: push-fastapi
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta-fastapi.outputs.tags }}
          labels: ${{ steps.meta-fastapi.outputs.labels }}

      # 9. Build + push DJANGO
      - name: Extract metadata for Django
        id: meta-django
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/alexandrecrestien/django-app

      - name: Build and push Django
        id: push-django
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./django_political_app
          push: true
          tags: ${{ steps.meta-django.outputs.tags }}
          labels: ${{ steps.meta-django.outputs.labels }}

      # 10. Build + push INGEST
      - name: Extract metadata for Ingest
        id: meta-ingest
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/alexandrecrestien/ingest-app

      - name: Build and push Ingest
        id: push-ingest
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./scripts/Dockerfile
          push: true
          tags: ${{ steps.meta-ingest.outputs.tags }}
          labels: ${{ steps.meta-ingest.outputs.labels }}

      # 11. Copy docker-compose to VPS
      - name: Copy docker-compose to VPS
        if: github.event_name == 'release'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.yaml"
          target: "~/political-prediction/"

      # 12. Deploy on VPS
      - name: Deploy on VPS
        if: github.event_name == 'release'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p ~/political-prediction/letsencrypt
            cd ~/political-prediction
            cat > .env << 'EOF'
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DEBUG=${{ secrets.DEBUG }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sed -i "s|:develop|:${{ github.ref_name }}|g" docker-compose.yaml
            docker compose -f docker-compose.yaml pull
            docker compose -f docker-compose.yaml up -d
            docker image prune -f